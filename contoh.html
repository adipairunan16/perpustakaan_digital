
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADI PHONE - Toko HP</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fa;
    color: #222;
}

header {
    background: #102a43;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #38bdf8;
}

.cart {
    background: #38bdf8;
    color: #102a43;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: bold;
}

.hero {
    background: linear-gradient(120deg,#102a43,#2563eb);
    color: white;
    padding: 65px 7%;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 17px;
    margin-bottom: 20px;
}

.hero button {
    padding: 13px 25px;
    border: none;
    border-radius: 7px;
    background: #38bdf8;
    cursor: pointer;
    font-weight: bold;
}

.container {
    padding: 40px 7%;
}

.tools {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}

input, select {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    flex: 1;
    min-width: 180px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 22px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 3px 12px #00000010;
    transition: .3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: contain;
    margin-bottom: 15px;
}

.card h3 {
    margin-bottom: 10px;
}

.price {
    color: #2563eb;
    font-weight: bold;
    font-size: 18px;
    margin: 12px 0;
}

.card button {
    width: 100%;
    padding: 12px;
    background: #102a43;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.card button:hover {
    background: #2563eb;
}

footer {
    text-align: center;
    padding: 25px;
    background: #102a43;
    color: white;
    margin-top: 40px;
}

@media(max-width:600px) {
    .hero h1 { font-size: 28px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">ADI <span>PHONE</span></div>
    <div class="cart">
        🛒 Keranjang: <span id="jumlah">0</span>
    </div>
</header>

<section class="hero">
    <h1>Selamat Datang di ADI PHONE</h1>
    <p>Temukan smartphone impian Anda dengan harga terbaik.</p>
    <button onclick="document.getElementById('produk').scrollIntoView()">
        Belanja Sekarang
    </button>
</section>

<section class="container" id="produk">

    <h2>Daftar Produk HP</h2>
    <p>Pilih smartphone favorit Anda.</p>

    <div class="tools">
        <input type="text" id="cari"
        placeholder="Cari nama HP..."
        oninput="tampilkanProduk()">

        <select id="kategori" onchange="tampilkanProduk()">
            <option value="Semua">Semua Kategori</option>
            <option value="Samsung">Samsung</option>
            <option value="Apple">Apple</option>
            <option value="Xiaomi">Xiaomi</option>
            <option value="Oppo">Oppo</option>
            <option value="Vivo">Vivo</option>
        </select>
    </div>

    <div class="products" id="daftarProduk"></div>

</section>

<footer>
    <h3>ADI PHONE</h3>
    <p>© 2026 ADI PHONE - Toko Smartphone Terpercaya</p>
    <p>Hubungi kami untuk informasi pemesanan.</p>
</footer>

<script>
const produk = [
    {
        nama: "Samsung Galaxy A55",
        kategori: "Samsung",
        harga: 5200000,
        gambar: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500"
    },
    {
        nama: "iPhone 15",
        kategori: "Apple",
        harga: 12500000,
        gambar: "https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?w=500"
    },
    {
        nama: "Xiaomi Redmi Note",
        kategori: "Xiaomi",
        harga: 2800000,
        gambar: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500"
    },
    {
        nama: "Oppo Reno",
        kategori: "Oppo",
        harga: 4500000,
        gambar: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500"
    },
    {
        nama: "Vivo V Series",
        kategori: "Vivo",
        harga: 3900000,
        gambar: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"
    },
    {
        nama: "Samsung Galaxy S",
        kategori: "Samsung",
        harga: 11000000,
        gambar: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500"
    }
];

let keranjang = 0;

function rupiah(angka) {
    return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }).format(angka);
}

function tampilkanProduk() {
    const cari = document.getElementById("cari").value.toLowerCase();
    const kategori = document.getElementById("kategori").value;

    const hasil = produk.filter(item =>
        item.nama.toLowerCase().includes(cari) &&
        (kategori === "Semua" || item.kategori === kategori)
    );

    const tempat = document.getElementById("daftarProduk");

    tempat.innerHTML = hasil.map((item, index) => `
        <div class="card">
            <img src="${item.gambar}" alt="${item.nama}">
            <h3>${item.nama}</h3>
            <p>Kategori: ${item.kategori}</p>
            <div class="price">${rupiah(item.harga)}</div>
            <button onclick="tambahKeranjang()">
                + Tambah ke Keranjang
            </button>
        </div>
    `).join("");

    if (hasil.length === 0) {
        tempat.innerHTML = "<p>Produk tidak ditemukan.</p>";
    }
}

function tambahKeranjang() {
    keranjang++;
    document.getElementById("jumlah").innerText = keranjang;
    alert("Produk berhasil ditambahkan ke keranjang!");
}

tampilkanProduk();
</script>

</body>
</html>
